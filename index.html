<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <link rel="icon" href="/favicon.ico" />
    <title>SX Portal</title>
  </head>
  <body>
    <div id="root">
      <div id="sx-startup-loader" style="min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:#f7f3fb;color:#142033;padding:24px;">
        <section style="max-width:360px;background:#fff;border:1px solid #d9e4f2;border-radius:18px;padding:24px;box-shadow:0 20px 60px rgba(40,30,55,.12);text-align:center;">
          <strong style="display:block;font-size:20px;margin-bottom:8px;">Loading SX Portal...</strong>
          <span style="font-size:14px;color:#5b6b82;">Getting the portal ready.</span>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function () {
        var shown = false;
        function showLoadError() {
          if (shown) return;
          var root = document.getElementById("root");
          if (!root || (root.children.length && !document.getElementById("sx-startup-loader"))) return;
          shown = true;
          root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:#f7f3fb;color:#142033;padding:24px;"><section style="max-width:460px;background:#fff;border:1px solid #d9e4f2;border-radius:18px;padding:28px;box-shadow:0 20px 60px rgba(40,30,55,.12);"><h1 style="font-size:24px;margin:0 0 10px;">SX Portal could not load</h1><p style="font-size:15px;line-height:1.5;margin:0 0 18px;">The app did not start properly in this browser. Please refresh the page once; if it keeps happening, tell Codex this message appeared.</p><button onclick="window.location.reload()" style="border:0;border-radius:999px;background:#005a9c;color:#fff;font-weight:700;padding:12px 18px;cursor:pointer;">Refresh</button></section></div>';
        }
        window.addEventListener("error", showLoadError);
        window.addEventListener("unhandledrejection", showLoadError);
      })();
    </script>
  </body>
  </html>
