<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signs Express · Portal preview</title><style>
:root{font-family:Inter,"Helvetica Neue",Arial,sans-serif;color:#323338;background:#f6f7fb;font-size:14px;--blue:#0073ea;--border:#e6e9ef}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}aside{position:fixed;inset:0 auto 0 0;width:230px;background:white;border-right:1px solid var(--border);padding:24px 16px;overflow:auto}.brand{font-size:23px;font-weight:800;color:#183a61;letter-spacing:-1px}.brand small{display:block;font-size:11px;letter-spacing:3px;color:#676879;margin-top:6px}.nav-label{font-size:10px;letter-spacing:1.8px;color:#9699a5;margin:28px 12px 12px}.nav{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;color:#676879;padding:11px 12px;border-radius:7px;margin:3px 0}.nav:hover{background:#f4f6fa}.nav.active{background:#eaf3ff;color:var(--blue);font-weight:600}.symbol{width:22px;font-size:18px}.main{margin-left:230px}header{height:70px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 32px}.search{background:#f6f7fb;border:1px solid var(--border);border-radius:6px;padding:10px 14px;width:320px}.avatar{border-radius:50%;background:#eaf3ff;color:#0073ea;padding:11px;font-weight:600}.preview{background:#edf5ff;border-bottom:1px solid #dceaff;padding:10px 32px;color:#326294;font-size:12px}.content{padding:28px 32px;max-width:1600px;margin:auto}h1{font-size:27px;font-weight:600;letter-spacing:-.6px;margin:0 0 8px}h2{font-size:17px;font-weight:600;margin:0}p{color:#676879;line-height:1.5}.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.muted{color:#9699a5;font-size:12px}.button{border:1px solid var(--border);background:white;padding:9px 15px;border-radius:6px;color:#323338}.primary{background:var(--blue);border-color:var(--blue);color:white}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:26px}.panel{background:white;border:1px solid var(--border);border-radius:9px;box-shadow:0 2px 4px #32333803}.stat{padding:22px}.stat strong{font-size:30px;display:block;margin:12px 0}.stat .trend{font-size:12px;color:#208b5b}.split{display:grid;grid-template-columns:2fr 1fr;gap:22px}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:1px solid var(--border)}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#9699a5;background:#fafbfc}td,th{padding:16px;border-bottom:1px solid #f0f1f5}tbody tr{cursor:pointer}tbody tr:hover{background:#f7faff}.ref{color:var(--blue);font-weight:600}.badge{font-size:11px;padding:5px 9px;border-radius:5px;background:#e9f7ef;color:#208b5b;display:inline-block}.badge.amber{background:#fff4de;color:#a97613}.badge.blue{background:#eaf3ff;color:#0073ea}.activity{padding:18px 20px;border-bottom:1px solid #f0f1f5;line-height:1.5}.activity b{display:block;font-weight:500}.module-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}.module{padding:22px;text-align:left;transition:.15s;color:inherit}.module:hover{border-color:#90bfff;transform:translateY(-2px)}.module .symbol{display:block;color:var(--blue);margin-bottom:15px}.module p{margin-bottom:0;font-size:13px}.toolbar{display:flex;gap:10px;margin-bottom:20px;align-items:center}.toolbar input{flex:1}.board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:18px}.column{background:#eef0f5;border-radius:9px;padding:12px;min-height:430px}.column h2{font-size:13px;margin:4px 2px 18px}.job{background:white;border:1px solid var(--border);border-radius:7px;padding:16px;margin-bottom:12px;cursor:pointer}.job:hover{border-color:#8cbfff}.job h3{font-size:14px;font-weight:600;margin:12px 0 6px}.job p{font-size:12px;margin:4px 0}.job footer{border-top:1px solid #f0f1f5;padding-top:12px;margin-top:14px;display:flex;justify-content:space-between;font-size:11px;color:#676879}.empty{padding:28px;text-align:center;color:#9699a5}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:24px}.field{display:flex;flex-direction:column;gap:8px}.field input,.field select,.field textarea{border:1px solid var(--border);padding:11px;border-radius:6px;background:white}.span{grid-column:1/-1}dialog{border:1px solid var(--border);border-radius:12px;width:min(560px,90vw);padding:0;box-shadow:0 20px 70px #182b4b33}dialog::backdrop{background:#182b4b66}.detail{padding:24px}.detail h1{font-size:22px}.close{float:right;border:0;background:#f0f2f7;border-radius:5px;padding:6px 10px}.notice{background:#f6f8fc;padding:14px;border-radius:6px;color:#676879;font-size:12px}.toast{position:fixed;bottom:24px;right:24px;background:#183a61;color:white;border-radius:8px;padding:14px 20px;z-index:5}.bar{height:8px;border-radius:8px;background:#edf0f6;margin:12px 0 20px}.bar i{display:block;height:100%;background:#0073ea;border-radius:8px}.mobile-menu{display:none}@media(max-width:1000px){aside{width:190px}.main{margin-left:190px}.content{padding:24px}.stats{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.board{grid-template-columns:repeat(2,1fr)}.module-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){aside{display:none;z-index:3;width:230px}aside.open{display:block}.main{margin-left:0}header{padding:0 18px}.search{width:180px}.mobile-menu{display:inline-block}.content{padding:20px 14px}.preview{padding:10px 14px}.board,.module-grid{grid-template-columns:1fr}.page-head{gap:12px}.form-grid{grid-template-columns:1fr}.span{grid-column:auto}table{font-size:12px}td,th{padding:10px}.table-wrap{overflow:auto}}
</style></head><body><aside id="sidebar"><div class="brand">signs express<small>TEAM PORTAL</small></div><div class="nav-label">WORKSPACE</div><nav id="nav"></nav><div class="nav-label">PREVIEW ENVIRONMENT</div><p style="padding:0 12px;font-size:12px">A fresh workspace for your team.<br>Sample data · Version 01</p></aside><main class="main"><header><button class="button mobile-menu" onclick="document.querySelector('aside').classList.toggle('open')">☰</button><input id="globalSearch" class="search" placeholder="Search modules…" aria-label="Search modules"><div style="display:flex;gap:18px;align-items:center"><span class="muted">Signs Express</span><span class="avatar">MR</span></div></header><div class="preview">DESIGN PREVIEW &nbsp; · &nbsp; Sample data only. Changes here stay in this preview.</div><div id="content" class="content"></div></main><dialog id="modal"></dialog><script>
const modules=[['Dashboard','◈','Your day at a glance'],['Installation Board','▦','Plan installations and coordinate your team'],['Design Board','✎','Manage artwork from brief to approval'],['Attendance','◷','See who is in and manage attendance'],['Holidays','☀','Plan leave and team availability'],['Mileage','↗','Record journeys and mileage claims'],['Vehicle Pricing','◇','Prepare vehicle graphics estimates'],['RAMS','▤','Create risk assessments and method statements'],['Social Post','◎','Prepare content for your social channels'],['Description Pull','≡','Review job descriptions from CoreBridge'],['Pro-Forma','▧','Prepare pro-forma documents'],['Subcontractors','♧','Manage your installation partners'],['Notifications','♬','Keep up with team updates']];
const jobs=[{ref:'ORD-4208',client:'Oakfield Retail',name:'Shopfront fascia & window graphics',date:'Monday · 12 Oct',person:'James & Alex',status:'Scheduled',value:'£2,450',type:'Panels'},{ref:'ORD-4211',client:'Northside Dental',name:'Reception lettering',date:'Tuesday · 13 Oct',person:'Chris',status:'Ready to install',value:'£980',type:'Lettering'},{ref:'ORD-4215',client:'Summit Logistics',name:'Fleet vehicle graphics',date:'Wednesday · 14 Oct',person:'James & Alex',status:'Awaiting artwork',value:'£3,200',type:'Vehicle graphics'},{ref:'ORD-4220',client:'Parkside Academy',name:'Wayfinding signage',date:'Thursday · 15 Oct',person:'Chris',status:'Scheduled',value:'£1,750',type:'Signage'}];
let current='Dashboard',view='board',query='';
const el=document.getElementById('content');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2800)}
function navigate(name){current=name;query='';view='board';location.hash=encodeURIComponent(name);render();document.querySelector('aside').classList.remove('open')}
function head(desc,action=''){return '<div class="page-head"><div><h1>'+current+'</h1><p style="margin:0">'+desc+'</p></div>'+action+'</div>'}
function badge(s){return '<span class="badge '+(s.includes('Awaiting')?'amber':s==='Scheduled'?'blue':'')+'">'+s+'</span>'}
function rows(){return '<div class="table-wrap"><table><thead><tr><th>Job</th><th>Customer / project</th><th>Team</th><th>Status</th></tr></thead><tbody>'+jobs.filter(j=>(j.ref+' '+j.client+' '+j.name).toLowerCase().includes(query.toLowerCase())).map((j)=>'<tr onclick="detail('+jobs.indexOf(j)+')"><td class="ref">'+j.ref+'</td><td><b>'+j.client+'</b><div class="muted" style="margin-top:5px">'+j.name+'</div></td><td>'+j.person+'</td><td>'+badge(j.status)+'</td></tr>').join('')+'</tbody></table></div>'}
function card(j){return '<article class="job" onclick="detail('+jobs.indexOf(j)+')"><div style="display:flex;justify-content:space-between"><span class="ref">'+j.ref+'</span><span class="muted">'+j.value+'</span></div><h3>'+j.client+'</h3><p>'+j.name+'</p><div style="margin-top:12px">'+badge(current==='Design Board'?'In design':j.status)+'</div><footer><span>'+j.person+'</span><span>'+j.type+'</span></footer></article>'}
function render(){document.getElementById('nav').innerHTML=modules.map(([n,i])=>'<button class="nav '+(n===current?'active':'')+'" onclick="navigate(\''+n+'\')"><span class="symbol">'+i+'</span>'+n+'</button>').join('');
if(current==='Dashboard'){el.innerHTML=head('Welcome back, Matt. Here’s what’s happening across your team.','<span class="muted">Thursday, 8 October 2026</span>')+'<div class="stats">'+[['Installations this week','12','4 ready to install'],['Jobs in design','18','6 awaiting approval'],['Team available','8 / 10','2 on annual leave'],['Open job value','£24,850','Across 14 active jobs']].map(([a,b,c])=>'<div class="panel stat"><span style="color:#676879">'+a+'</span><strong>'+b+'</strong><span class="trend">'+c+'</span></div>').join('')+'</div><div class="split"><section class="panel"><div class="panel-head"><h2>Upcoming installations</h2><button class="button" onclick="navigate(\'Installation Board\')">View board →</button></div>'+rows()+'</section><section class="panel"><div class="panel-head"><h2>Team activity</h2>'+badge('Today')+'</div>'+['Artwork approved · Northside Dental','Installation scheduled · Oakfield Retail','Mileage claim submitted · James','New design brief · Parkside Academy'].map((t,i)=>'<div class="activity"><b>'+t+'</b><span class="muted">'+(i+1)+' hours ago · Sample activity</span></div>').join('')+'</section></div><h2 style="margin-top:30px">Your workspace</h2><div class="module-grid">'+modules.slice(1).map(([n,i,d])=>'<button class="panel module" onclick="navigate(\''+n+'\')"><span class="symbol">'+i+'</span><h2>'+n+'</h2><p>'+d+'</p></button>').join('')+'</div>';return}
if(current==='Installation Board'||current==='Design Board'){el.innerHTML=head(current==='Design Board'?'A clear view of your artwork pipeline.':'Plan the week, assign teams, and keep jobs moving.','<button class="button primary" onclick="newEntry()">+ Add job</button>')+'<div class="toolbar"><input class="search" id="filter" placeholder="Search job reference or customer…" value="'+esc(query)+'"><button class="button" onclick="view=\'board\';render()">Board</button><button class="button" onclick="view=\'list\';render()">List</button><button class="button" onclick="toast(\'Preview refreshed — sample jobs are up to date\')">↻ Refresh</button></div>'+(view==='list'?'<section class="panel">'+rows()+'</section>':'<div class="board">'+(current==='Design Board'?['New briefs','In design','Awaiting sign-off','Approved']:['Monday · 12 Oct','Tuesday · 13 Oct','Wednesday · 14 Oct','Thursday · 15 Oct']).map((day,i)=>'<section class="column"><h2>'+day+' <span class="muted" style="float:right">1</span></h2>'+jobs.filter(j=>(j.ref+' '+j.client+' '+j.name).toLowerCase().includes(query.toLowerCase())).filter(j=>jobs.indexOf(j)===i).map(card).join('')+'<button class="nav" onclick="newEntry()">+ Add job</button></section>').join('')+'</div>');document.getElementById('filter').oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;render();const f=document.getElementById('filter');f.focus();f.setSelectionRange(pos,pos)};return}
if(current==='Notifications'){el.innerHTML=head('Updates from across your workspace.')+'<section class="panel">'+['Artwork approved for Northside Dental','Oakfield Retail installation is scheduled','James submitted a mileage claim','Parkside Academy brief is ready to review'].map(t=>'<div class="activity"><b>'+t+'</b><span class="muted">Today · Sample notification</span><button class="button" style="float:right" onclick="this.closest(\'.activity\').remove();toast(\'Marked as read in this preview\')">Mark read</button></div>').join('')+'</section>';return}
const configs={'Attendance':['Team attendance',[['James Turner','In · 08:00'],['Alex Morgan','In · 08:15'],['Chris Wilson','On site'],['Sarah Reed','Annual leave']]],'Holidays':['Leave requests',[['Sarah Reed','12–16 October · Approved'],['James Turner','23 October · Pending'],['Alex Morgan','2–6 November · Approved']]],'Subcontractors':['Installation partners',[['Precision Installations','Signage · Available'],['Apex Access','Access equipment · Available'],['Fleet Graphics Team','Vehicle graphics · Available']]]};
if(configs[current]){const [title,data]=configs[current];el.innerHTML=head(modules.find(m=>m[0]===current)[2],'<button class="button primary" onclick="newEntry()">+ '+(current==='Holidays'?'Request leave':current==='Attendance'?'Record attendance':'Add partner')+'</button>')+'<section class="panel"><div class="panel-head"><h2>'+title+'</h2><span class="muted">Sample records</span></div>'+data.map(([a,b])=>'<div class="activity" onclick="toast(\'Sample record selected: '+a+'\')"><b>'+a+'</b><span class="muted">'+b+'</span></div>').join('')+'</section>';return}
const fields=current==='Mileage'?['Journey date','From postcode','To postcode','Miles','Job reference','Notes']:current==='Vehicle Pricing'?['Vehicle type','Customer','Coverage','Quantity','Job reference','Notes']:current==='RAMS'?['Job reference','Site address','Installation date','Team members','Work description','Site hazards']:current==='Social Post'?['Platform','Job reference','Post title','Publish date','Caption','Notes']:current==='Description Pull'?['Job reference','Customer','Line item name','Category','Description','Notes']:['Job reference','Customer','Document date','Net total','Description','Notes'];
el.innerHTML=head(modules.find(m=>m[0]===current)[2])+'<section class="panel"><div class="panel-head"><h2>'+({'Mileage':'New mileage claim','Vehicle Pricing':'Vehicle estimate','RAMS':'New assessment','Social Post':'Create a post','Description Pull':'Job description','Pro-Forma':'New pro-forma'}[current])+'</h2><span class="muted">Draft workspace</span></div><form onsubmit="event.preventDefault();toast(\'Saved in this preview only\')"><div class="form-grid">'+fields.map((f,i)=>'<label class="field '+(i>=4?'span':'')+'">'+f+(i>=4?'<textarea rows="3" placeholder="'+f+'"></textarea>':'<input '+(f.toLowerCase().includes('date')?'type="date"':'')+' placeholder="'+f+'">')+'</label>').join('')+'<div class="span notice">This first draft demonstrates the layout and navigation. CoreBridge lookups, document generation, and submissions are not connected.</div><div class="span"><button class="button primary">Save draft</button> <button type="reset" class="button">Clear</button></div></div></form></section>'}
function detail(i){const j=jobs[i],d=document.getElementById('modal');d.innerHTML='<div class="detail"><button class="close" onclick="document.getElementById(\'modal\').close()">✕</button><span class="ref">'+j.ref+'</span><h1 style="margin-top:16px">'+j.client+'</h1><p>'+j.name+'</p>'+badge(j.status)+'<div class="form-grid" style="padding:24px 0"><div><span class="muted">Scheduled</span><p>'+j.date+'</p></div><div><span class="muted">Assigned team</span><p>'+j.person+'</p></div><div><span class="muted">Net value</span><p>'+j.value+'</p></div><div><span class="muted">Category</span><p>'+j.type+'</p></div><label class="field span">Team notes<textarea placeholder="Add a note for the team…" rows="3"></textarea></label></div><button class="button primary" onclick="toast(\'Note saved in this preview only\');document.getElementById(\'modal\').close()">Save note</button><p class="muted">Fictional sample job · No live data connection</p></div>';d.showModal()}
function newEntry(){const d=document.getElementById('modal');d.innerHTML='<div class="detail"><button class="close" onclick="document.getElementById(\'modal\').close()">✕</button><h1>Add to '+current+'</h1><form onsubmit="event.preventDefault();toast(\'Preview entry saved\');document.getElementById(\'modal\').close()"><div class="form-grid" style="padding:20px 0"><label class="field span">Name / reference<input required placeholder="Enter a name or reference"></label><label class="field span">Notes<textarea rows="4"></textarea></label><div class="span notice">This is a layout preview. The entry will not be added to the live portal.</div></div><button class="button primary">Save preview entry</button></form></div>';d.showModal()}
document.getElementById('globalSearch').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.nav').forEach(b=>{if(b.closest('nav'))b.style.display=b.textContent.toLowerCase().includes(q)?'flex':'none'})};window.onhashchange=()=>{const n=decodeURIComponent(location.hash.slice(1));if(modules.some(m=>m[0]===n)){current=n;render()}};if(location.hash){const n=decodeURIComponent(location.hash.slice(1));if(modules.some(m=>m[0]===n))current=n}render();
</script></body></html>
